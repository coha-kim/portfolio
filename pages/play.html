<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play — Seoha Kim</title>
  <link rel="icon" type="image/png" href="../assets/icons/seoha-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=20261111.1">
  <link rel="stylesheet" href="../css/play.css?v=20261111.1">
</head>
<body>

  <div class="site">
    <aside class="side-nav" id="side-nav" data-current="play"></aside>
    <script src="../js/side-nav.js?v=20261111.1"></script>

    <main class="site-main page play">
      <header class="play-head g">
        <h1 class="t-statement c-7-13">Welcome to playground. More to come.</h1>
      </header>

      <ul class="play-grid">
        <li class="play-item at-bottom">
          <button type="button" class="play-media" aria-label="Play video: Fluid sim">
            <video src="../assets/play/fluid.mp4" poster="../assets/play/fluid.webp" muted loop playsinline preload="none"></video>
          </button>
          <p class="play-cap">Fluid sim</p>
        </li>
        <li class="play-item is-big">
          <button type="button" class="play-media" aria-label="Play video: Water ripple">
            <video src="../assets/play/interactive-ripples.mp4" poster="../assets/play/interactive-ripples.webp" muted loop playsinline preload="none"></video>
          </button>
          <p class="play-cap">Water ripple</p>
        </li>
        <li class="play-item at-top">
          <button type="button" class="play-media" aria-label="Image: AI image gen">
            <img src="../assets/play/ai-image-gen.webp" alt="Silver snake coiled among flowers, AI-generated" loading="lazy">
          </button>
          <p class="play-cap">AI image gen</p>
        </li>
        <li class="play-item at-top">
          <button type="button" class="play-media" aria-label="Play video: Point cloud">
            <video src="../assets/play/pointcloud.mp4" poster="../assets/play/pointcloud.webp" muted loop playsinline preload="none"></video>
          </button>
          <p class="play-cap">Point cloud</p>
        </li>
        <li class="play-item at-bottom">
          <button type="button" class="play-media" aria-label="Play video: Abstract study">
            <video src="../assets/play/abstract-study.mp4" poster="../assets/play/abstract-study.webp" muted loop playsinline preload="none"></video>
          </button>
          <p class="play-cap">Abstract study</p>
        </li>
        <li class="play-item is-big">
          <button type="button" class="play-media" aria-label="Play video: Reactive ocean">
            <video src="../assets/play/reactive-ocean.mp4" poster="../assets/play/reactive-ocean.webp" muted loop playsinline preload="none"></video>
          </button>
          <p class="play-cap">Reactive ocean</p>
        </li>
        <li class="play-item is-big">
          <button type="button" class="play-media" aria-label="Play video: Audio-reactive">
            <video src="../assets/play/reactive-abstract.mp4" poster="../assets/play/reactive-abstract.webp" muted loop playsinline preload="none"></video>
          </button>
          <p class="play-cap">Audio-reactive</p>
        </li>
      </ul>
    </main>
  </div>

  <script src="../js/play.js?v=20261111.1" defer></script>
</body>
</html>
