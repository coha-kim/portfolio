<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play — Seoha Kim</title>
  <link rel="icon" type="image/png" href="../assets/icons/seoha-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=20261105.5">
  <link rel="stylesheet" href="../css/play.css?v=20261105.5">
</head>
<body>

  <div class="site">
    <aside class="side-nav" id="side-nav" data-current="play"></aside>
    <script src="../js/side-nav.js?v=20261105.5"></script>

    <main class="site-main play">
      <h1 class="visually-hidden">Play</h1>
      <ul class="play-grid">
        <li class="play-item">
          <div class="play-frame"><button type="button" class="play-media is-wide" aria-label="Play video: Water ripple">
            <video src="../assets/play/interactive-ripples.mp4" poster="../assets/play/interactive-ripples.webp" muted loop playsinline preload="none"></video>
          </button></div>
          <p class="play-cap">Water ripple</p>
        </li>
        <li class="play-item">
          <div class="play-frame"><button type="button" class="play-media is-tall" aria-label="Image: AI image gen">
            <img src="../assets/play/ai-image-gen.webp" alt="Silver snake coiled among flowers, AI-generated" loading="lazy">
          </button></div>
          <p class="play-cap">AI image gen</p>
        </li>
        <li class="play-item">
          <div class="play-frame"><button type="button" class="play-media is-wide is-small" aria-label="Play video: Fluid sim">
            <video src="../assets/play/fluid.mp4" poster="../assets/play/fluid.webp" muted loop playsinline preload="none"></video>
          </button></div>
          <p class="play-cap">Fluid sim</p>
        </li>
        <li class="play-item">
          <div class="play-frame"><button type="button" class="play-media is-4x3" aria-label="Play video: Point cloud">
            <video src="../assets/play/pointcloud.mp4" poster="../assets/play/pointcloud.webp" muted loop playsinline preload="none"></video>
          </button></div>
          <p class="play-cap">Point cloud</p>
        </li>
        <li class="play-item">
          <div class="play-frame"><button type="button" class="play-media is-5x4" aria-label="Image: [caption]">
            <img src="../assets/play/flow.webp" alt="Flowchart of a logic experiment" loading="lazy">
          </button></div>
          <p class="play-cap">[Caption]</p>
        </li>
        <li class="play-item">
          <div class="play-frame"><button type="button" class="play-media is-wide" aria-label="Play video: Reactive ocean">
            <video src="../assets/play/reactive-ocean.mp4" poster="../assets/play/reactive-ocean.webp" muted loop playsinline preload="none"></video>
          </button></div>
          <p class="play-cap">Reactive ocean</p>
        </li>
        <li class="play-item">
          <div class="play-frame"><button type="button" class="play-media is-wide" aria-label="Play video: Audio-reactive">
            <video src="../assets/play/reactive-abstract.mp4" poster="../assets/play/reactive-abstract.webp" muted loop playsinline preload="none"></video>
          </button></div>
          <p class="play-cap">Audio-reactive</p>
        </li>
        <li class="play-item">
          <div class="play-frame"><button type="button" class="play-media is-wide is-small" aria-label="Play video: Abstract study">
            <video src="../assets/play/abstract-study.mp4" poster="../assets/play/abstract-study.webp" muted loop playsinline preload="none"></video>
          </button></div>
          <p class="play-cap">Abstract study</p>
        </li>
      </ul>
    </main>
  </div>

  <script src="../js/play.js?v=20261105.5" defer></script>
</body>
</html>
