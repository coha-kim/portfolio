<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakkatchae — Seoha Kim</title>
  <link rel="icon" type="image/png" href="../assets/icons/seoha-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=20261111.7">
  <link rel="stylesheet" href="../css/case-study.css?v=20261111.7">
</head>
<body>

  <div class="site">
    <aside class="side-nav" id="side-nav" data-current="bakatchae"></aside>
    <script src="../js/side-nav.js?v=20261111.7"></script>

    <!-- Branding page, not a case study: same header, then image rows only. -->
    <main class="site-main page cs cs--bakkatchae">

      <!-- Header (no hero): text on the left, logo on the right -->
      <header class="g cs-head bk-head">
        <figure class="m bk-logo"><div class="m-box">
          <img src="../assets/bakkatchae/bakkatchae-logo.webp" alt="Bakkatchae logo: the café's name drawn in thin, architectural lines, light on deep maroon">
        </div></figure>
        <h1 class="t-display c-1-9">Bakkatchae</h1>
        <p class="t-lede c-1-6">Branding and strategies for a cafe in Jeju Island, Korea.</p>
        <dl class="cs-meta c-1-6">
          <div><dt class="t-label">Areas</dt><dd class="t-meta">Branding &amp; strategies</dd></div>
          <div><dt class="t-label">Type</dt><dd class="t-meta">Commercial</dd></div>
          <div><dt class="t-label">Year</dt><dd class="t-meta">2026</dd></div>
          <div><dt class="t-label">Instagram</dt><dd class="t-meta"><a class="cs-meta__link" href="https://www.instagram.com/bakatchae_jeju/" target="_blank" rel="noopener">@bakatchae_jeju <span aria-hidden="true">↗</span><span class="visually-hidden"> (opens in a new tab)</span></a></dd></div>
        </dl>
      </header>

      <!-- Print: menu + guide, on the café's dark brown -->
      <div class="g cs-row">
        <figure class="m m--half m--plate m--brand"><div class="m-box"><img src="../assets/bakkatchae/bakkatchae-menu.webp" alt="Menu on cream paper: coffee, non-coffee, tea and ade lists in Korean and English, with a contour-line illustration of Hallasan" loading="lazy"></div><figcaption>Menu</figcaption></figure>
        <figure class="m m--half m--plate m--brand"><div class="m-box"><img src="../assets/bakkatchae/bakkatchae-guide.webp" alt="Two tall leaflet panels: a cover with Wi-Fi details and a contour illustration, and a floor guide describing each of the café's three floors" loading="lazy"></div><figcaption>Floor guide</figcaption></figure>
      </div>

      <!-- Identity in use -->
      <div class="g cs-row">
        <figure class="m m--third"><div class="m-box"><img src="../assets/bakkatchae/bakkatchae-sticker.webp" alt="Round sticker with the logo and contour lines sealing a white paper bag" loading="lazy"></div><figcaption>Sticker</figcaption></figure>
        <figure class="m m--third"><div class="m-box"><img src="../assets/bakkatchae/bakkatchae-entrance.webp" alt="The café's entrance: a timber-framed doorway with a small pink sign, opening onto a staircase" loading="lazy"></div><figcaption>Entrance</figcaption></figure>
        <figure class="m m--third"><div class="m-box"><img src="../assets/bakkatchae/bakkatchae-poster.webp" alt="Grand opening poster: a hand-lettered paper flyer with two clinking beer mugs, framed by green Grand Opening type on dark brown" loading="lazy"></div><figcaption>Grand opening poster</figcaption></figure>
      </div>

      <!-- Interior: small 2×2 -->
      <div class="g cs-row">
        <figure class="m m--grid4">
          <div class="m-grid4">
            <div class="m-box"><img src="../assets/bakkatchae/bakkatchae-interior-1.webp" alt="Two wooden chairs on a concrete terrace beside a moss garden and a young tree" loading="lazy"></div>
            <div class="m-box"><img src="../assets/bakkatchae/bakkatchae-interior-2.webp" alt="Looking down on the rooftop: a timber deck with straw cushions and guests sitting by a shallow pool" loading="lazy"></div>
            <div class="m-box"><img src="../assets/bakkatchae/bakkatchae-interior-3.webp" alt="Concrete-block shelving with potted plants and hanging air plants against a white wall" loading="lazy"></div>
            <div class="m-box"><img src="../assets/bakkatchae/bakkatchae-interior-4.webp" alt="A black HOME HOUSE wall hanging above a console with a radio, a mushroom lamp and a small plant" loading="lazy"></div>
          </div>
          <figcaption>The café</figcaption>
        </figure>
      </div>

      <a class="cs-next" href="new-sod.html">
        <span class="t-label t-muted">Next project</span>
        <span class="cs-next__title">Shape of Days <span aria-hidden="true">→</span></span>
      </a>
    </main>
  </div>
</body>
</html>
