<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seoha Kim — Experience designer</title>
  <link rel="icon" type="image/png" href="assets/icons/seoha-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261105.8">
  <link rel="stylesheet" href="css/landing.css?v=20261105.8">
</head>
<body>

  <div class="site">
    <aside class="side-nav" id="side-nav" data-current="home"></aside>
    <script src="js/side-nav.js?v=20261105.8"></script>

    <main class="site-main landing-arena" id="arena">
      <h1 class="visually-hidden">Seoha Kim, experience designer</h1>

      <div class="sling-lines" aria-hidden="true">
        <div class="sling-proj"></div>
        <div class="sling-lead"></div>
        <div class="sling-dot"></div>
        <div class="sling-energy t-label"></div>
      </div>

      <!-- Static name until landing.js takes over (also the no-JS / reduced-motion view) -->
      <div class="sling-letters" aria-hidden="true">
        <span class="sling-static">Seoha Kim</span>
      </div>

      <p class="sling-hint t-label" aria-hidden="true">Pull my name, then let go</p>

      <p class="visually-hidden" aria-live="polite" data-buddy-said></p>

      <div class="sling-controls">
        <button type="button" data-launch>Launch <span aria-hidden="true">↗</span></button>
        <button type="button" data-reset hidden>Reset <span aria-hidden="true">↺</span></button>
      </div>
    </main>
  </div>

  <script src="js/landing.js?v=20261105.8" defer></script>
  <script src="js/buddy.js?v=20261105.8" defer></script>
</body>
</html>
